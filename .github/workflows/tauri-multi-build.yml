name: Tauri Multi-Platform Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.2.0 or 0.2.0). Applied to tauri.conf / package.json / Cargo.toml before build."
        required: true
      release_name:
        description: "Release title"
        required: false
        default: "NELA Release"

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_label: Windows
            bundles: nsis
          - os: ubuntu-latest
            os_label: Linux
            bundles: deb
          - os: macos-latest
            os_label: macOS
            bundles: dmg

    runs-on: ${{ matrix.os }}

    env:
      NODE_VERSION: 24

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Node Dependencies
        run: npm install
        working-directory: genhat-desktop

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Apply workflow version to Tauri package
        working-directory: genhat-desktop
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/set-release-version.mjs

      - name: Ensure model placeholders
        shell: bash
        run: |
          mkdir -p \
            models/bge-1.5-embed \
            models/distilBert-query-router/onnx_model \
            models/grader/ms-marco-MiniLM-L6-v2-onnx-int8 \
            models/tts/kitten-tts/mini \
            models/LLM \
            models/LiquidAI-VLM \
            models/parakeet
          touch \
            models/.placeholder \
            models/bge-1.5-embed/.placeholder \
            models/distilBert-query-router/.placeholder \
            models/distilBert-query-router/onnx_model/.placeholder \
            models/grader/.placeholder \
            models/grader/ms-marco-MiniLM-L6-v2-onnx-int8/.placeholder \
            models/tts/.placeholder \
            models/tts/kitten-tts/.placeholder \
            models/tts/kitten-tts/mini/.placeholder \
            models/LLM/.placeholder \
            models/LiquidAI-VLM/.placeholder \
            models/parakeet/.placeholder

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            pkg-config

      - name: Fetch llama.cpp release binaries
        working-directory: genhat-desktop
        run: npm run prepare:llama

      - name: Build Tauri App
        run: npx tauri build --bundles ${{ matrix.bundles }}
        working-directory: genhat-desktop
        env:
          # Public Desktop OAuth client (PKCE). Set repo secret when ops creates the client.
          NELA_GOOGLE_CONNECTOR_CLIENT_ID: ${{ secrets.NELA_GOOGLE_CONNECTOR_CLIENT_ID }}

      - name: Stage installers (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $bundleDir = Join-Path $env:GITHUB_WORKSPACE "genhat-desktop/src-tauri/target/release/bundle"
          $outDir = Join-Path $env:GITHUB_WORKSPACE "dist-artifacts"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $files = Get-ChildItem -Path $bundleDir -Recurse -Include "*.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like "NELA*" }
          if (-not $files) { Write-Error "No NELA installers found in $bundleDir"; exit 1 }
          foreach ($f in $files) {
            Copy-Item -Force $f.FullName (Join-Path $outDir $f.Name)
          }
          Get-ChildItem $outDir | ForEach-Object { $_.FullName }

      - name: Stage installers (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          BUNDLE_DIR="genhat-desktop/src-tauri/target/release/bundle"
          OUT_DIR="dist-artifacts"
          mkdir -p "$OUT_DIR"
          mapfile -t FILES < <(find "$BUNDLE_DIR" -type f -name "*.deb")
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No .deb installers found in $BUNDLE_DIR"
            exit 1
          fi
          for f in "${FILES[@]}"; do
            cp -f "$f" "$OUT_DIR/"
          done
          ls -la "$OUT_DIR"

      - name: Stage installers (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          BUNDLE_DIR="genhat-desktop/src-tauri/target/release/bundle"
          OUT_DIR="dist-artifacts"
          mkdir -p "$OUT_DIR"

          while IFS= read -r dmg; do
            [ -n "$dmg" ] && cp -f "$dmg" "$OUT_DIR/"
          done < <(find "$BUNDLE_DIR" -type f -name "*.dmg" -print)

          while IFS= read -r app; do
            [ -z "$app" ] && continue
            ZIP_NAME="$(basename "$app").zip"
            ZIP_PATH="$OUT_DIR/$ZIP_NAME"
            rm -f "$ZIP_PATH"
            ditto -c -k --keepParent "$app" "$ZIP_PATH"
          done < <(find "$BUNDLE_DIR" -type d -name "*.app" -print)

          if [ -z "$(ls -A "$OUT_DIR" 2>/dev/null)" ]; then
            echo "No macOS installers found in $BUNDLE_DIR"
            exit 1
          fi
          ls -la "$OUT_DIR"

      - name: Upload OS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nela-${{ matrix.os_label }}
          path: dist-artifacts/*
          if-no-files-found: error

  release:
    name: Create unified GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Normalize release tag
        id: tag
        run: |
          RAW="${{ inputs.version }}"
          RAW="${RAW#v}"
          TAG="v${RAW}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using release tag: $TAG"

      - name: Download all OS artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: nela-*
          merge-multiple: true

      - name: List release assets
        run: |
          echo "Assets to publish:"
          find release-assets -type f | sort
          test -n "$(find release-assets -type f | head -1)" || {
            echo "No artifacts downloaded"
            exit 1
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ inputs.release_name }} ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          files: release-assets/*
          fail_on_unmatched_files: true
          make_latest: true

  trigger-vercel-deploy:
    name: Trigger Vercel Deploy
    needs: release
    runs-on: ubuntu-latest
    steps:
      # Redeploys the NELA-Webpage Vercel project so /download picks up the new release.
      # Setup:
      # 1. Vercel → NELA-Webpage project → Settings → Git → Deploy Hooks → Create Hook
      # 2. Add the hook URL as repo secret VERCEL_DEPLOY_HOOK on nela-local/nela-private
      - name: Call Vercel Deploy Hook with Retries
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK secret is not set on this repo. Skipping."
            exit 0
          fi
          for i in 1 2 3 4; do
            echo "Attempt $i to trigger Vercel..."
            if curl -f -sS -X POST "$VERCEL_DEPLOY_HOOK"; then
              echo -e "\nSuccessfully triggered Vercel deploy!"
              exit 0
            fi
            if [ $i -lt 4 ]; then
              echo "Attempt $i failed. Retrying in 10 seconds..."
              sleep 10
            fi
          done
          echo "All attempts to trigger Vercel failed."
          exit 1
