[package]
name = "file-indexer"
version = "0.1.0"
edition = "2021"
description = "Local filename + content + semantic file indexer (NELA sidecar)"
publish = false

[workspace]

[lib]
name = "file_indexer"
path = "src/lib.rs"

[[bin]]
name = "fileindexer_sidecar"
path = "src/bin/fileindexer_sidecar.rs"

[[bin]]
name = "fileindexer_cli"
path = "src/bin/fileindexer_cli.rs"

[dependencies]
bincode = "1.3"
clap = { version = "4", features = ["derive"] }
notify = "6"
pdf-extract = "0.12.0"
quick-xml = "0.41.0"
rayon = "1.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
walkdir = "2.5.0"
zip = "8"

# Embedding stack stays in this crate only (not linked into the main NELA app).
[target.'cfg(windows)'.dependencies]
fastembed = { version = "5.17.3", features = ["directml"] }
ort = { version = "2.0.0-rc.12", features = ["directml"] }

[target.'cfg(not(windows))'.dependencies]
fastembed = "5.17.3"
ort = { version = "2.0.0-rc.12", features = ["download-binaries"] }

[dev-dependencies]
tempfile = "3"
