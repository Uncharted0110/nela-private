<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><title>Can you give me a presentation of world war 2?</title></head><body>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World War II: A Complete History</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            overflow: hidden;
            height: 100vh;
        }

        .slides-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            padding: 60px 80px;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            text-align: left;
        }

        .slide.active {
            opacity: 1;
            z-index: 10;
        }

        .slide:nth-child(1) {
            background: linear-gradient(135deg, #c53030 0%, #852733 100%);
        }

        .slide:nth-child(2) {
            background: linear-gradient(135deg, #2c5282 0%, #1a365d 100%);
        }

        .slide:nth-child(3) {
            background: linear-gradient(135deg, #5d4037 0%, #3e2723 100%);
        }

        .slide:nth-child(4) {
            background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
        }

        .slide:nth-child(5) {
            background: linear-gradient(135deg, #7b2cbf 0%, #553c9a 100%);
        }

        .slide:nth-child(6) {
            background: linear-gradient(135deg, #9b5de5 0%, #5856d6 100%);
        }

        .slide:nth-child(7) {
            background: linear-gradient(135deg, #00bbf9 0%, #0072ce 100%);
        }

        .slide:nth-child(8) {
            background: linear-gradient(135deg, #ff9f1c 0%, #ff6585 100%);
        }

        .slide:nth-child(9) {
            background: linear-gradient(135deg, #e63946 0%, #a8dadc 100%);
        }

        .slide:nth-child(10) {
            background: linear-gradient(135deg, #457b9d 0%, #1d3557 100%);
        }

        .slide:nth-child(11) {
            background: linear-gradient(135deg, #f4a261 0%, #e76f51 100%);
        }

        .slide:nth-child(12) {
            background: linear-gradient(135deg, #2a9d8f 0%, #264653 100%);
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #ffeb3b;
            border-bottom: 3px solid #ffeb3b;
            padding-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        h3 {
            font-size: 1.4rem;
            margin: 15px 0 10px 0;
            color: #ffeb3b;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 15px;
            max-width: 800px;
            text-align: left;
        }

        ul {
            list-style: none;
            margin: 15px 0;
            padding-left: 20px;
            max-width: 850px;
        }

        ul li {
            margin-bottom: 10px;
            padding-left: 15px;
            position: relative;
        }

        ul li::before {
            content: "→";
            position: absolute;
            left: 0;
            color: #ffeb3b;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .highlight {
            background: rgba(255, 235, 19, 0.3);
            padding: 5px 10px;
            border-radius: 5px;
            border-left: 4px solid #ffeb3b;
            margin: 10px 0;
        }

        .counter {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: rgba(0,0,0,0.5);
            padding: 10px 25px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 100;
        }

        .nav-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
            padding: 15px 30px;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .nav-btn:hover {
            background: white;
            color: #1a1a2e;
            transform: scale(1.05);
        }

        .nav-btn.prev {
            align-self: flex-start;
        }

        .nav-btn.next {
            align-self: flex-end;
        }

        .timeline {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .timeline-item {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            min-width: 120px;
        }

        .timeline-year {
            font-weight: bold;
            font-size: 1.2rem;
            color: #ffeb3b;
        }

        .timeline-event {
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .map-container {
            margin: 20px 0;
            position: relative;
            height: 300px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            overflow: hidden;
        }

        .map-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
</body>
</html>
